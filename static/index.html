<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Manager</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Paper Manager</div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <h2>論文を追加</h2>
        <form id="paper-form">
          <input id="paper-url" type="text" placeholder="arXiv URL / arXiv:ID / ID" required>
          <button id="paper-add-button" type="submit">追加</button>
        </form>
        <p class="hint">例: https://arxiv.org/abs/2401.12345</p>
      </section>

      <section class="panel">
        <h2>カテゴリ生成</h2>
        <textarea id="category-prompt" rows="7"
          placeholder="例: 研究手法ごとに分類してください。"></textarea>
        <button id="category-button" type="button">カテゴリを生成</button>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <h2>カテゴリセット</h2>
          <span id="category-set-id" class="small-label"></span>
        </div>
        <div id="category-list" class="category-list">
          <div class="muted">まだカテゴリがありません。</div>
        </div>
        <button id="jev-button" type="button" disabled>Jevで分類</button>
      </section>
    </aside>

    <section class="content">
      <div class="content-header">
        <div>
          <h1>登録済み論文</h1>
          <div id="paper-count" class="count">0 papers</div>
        </div>
        <button id="refresh-button" class="secondary" type="button">更新</button>
      </div>

      <div id="message" class="message hidden"></div>

      <section id="classification-results" class="results hidden">
        <div class="results-header">
          <h2>Jev分類結果</h2>
        </div>
        <div id="result-list"></div>
      </section>

      <div id="papers" class="paper-list">
        <div class="empty">論文がありません。</div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
